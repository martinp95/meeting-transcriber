name: Release and Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # 1. CI Check: Ensure code builds before doing anything else
  ci-check:
    name: CI Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Generate package-lock
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist folder not found"
            exit 1
          fi

  # 2. Publish Docker: Build and push the image to Registry
  publish-docker:
    name: Publish Docker Image
    needs: ci-check
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Create Release: Now that image exists, create the GitHub Release
  create-release:
    name: Create GitHub Release
    needs: publish-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Release Body
        id: prepare_body
        shell: bash
        run: |
          # Read the template file
          BODY_CONTENT=$(cat .github/release_notes.md)
          
          # Replace placeholders with actual variables
          # We use | as delimiter to avoid issues with slashes in repo names
          BODY_CONTENT="${BODY_CONTENT//\{\{REPO\}\}/${{ github.repository }}}"
          BODY_CONTENT="${BODY_CONTENT//\{\{VERSION\}\}/${{ github.ref_name }}}"
          
          # Save to a temporary file to use in the release step
          echo "$BODY_CONTENT" > release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_body.md
          # This automatically appends the list of commits/changes to the body
          generate_release_notes: true
          draft: false
          prerelease: false